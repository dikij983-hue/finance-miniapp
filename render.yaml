# Blueprint для https://render.com — New → Blueprint → выбрать репозиторий
# Перед деплоем создайте БД в Neon и в Render укажите переменные DATABASE_URL, BOT_TOKEN, JWT_SECRET
version: "1"
services:
  - type: web
    name: finance-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_BEARER_KEY
        sync: false
      - key: API_USER_TELEGRAM_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
